version: 0.2
env:

  # Secrets used to store credentials, example Docker credentials are needed to pull base images, otherwise 
  # the system will occur into a API block by Docker
  parameter-store:
    DOCKERHUB_USERNAME: "/lw/dockerhub/user"
    DOCKERHUB_PASS: "/lw/dockerhub/password"

phases:
  install:
    commands:
      # Configuring Containerd image store
      - echo "Configure Docker Daemon"
      - mkdir -p /etc/docker
      - "echo '{\n  \"features\": {\n    \"containerd-snapshotter\": true\n  }\n}' > /etc/docker/daemon.json"
      - echo "Restart Docker Daemon"
      - kill $(cat /var/run/docker.pid) && rm -rf /var/run/docker.pid
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --storage-driver=overlayfs &
      - timeout 20 sh -c "until docker info; do echo .; sleep 1; done"

      # Creating the containerd builder
      - docker buildx create --name containerd --driver=docker-container --driver-opt default-load=true

  pre_build:
    commands:
    # Debug
    - echo "CodeBuild environment information:"
    - uname -a
    - cat /etc/os-release
    - echo "Docker info:"
    - docker info

    # # Trying to solve problem with kernel version updating the enviroment before building the image
    # - yum update -y
    # - yum upgrade -y

    # DO not change the login into docker 
    - echo 'Logging into docker to prevent pull limits...'
    - docker login --username $DOCKERHUB_USERNAME --password $DOCKERHUB_PASS

    - echo $DOCKERHUB_USERNAME
    - echo $DOCKERHUB_PASS
    # Testing pull rates limits, this should be avoided once we login into docker 
    # but a test doesn't hurt
    - echo 'Testing pull rate limits...'
    - TOKEN=$(curl "https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull" | jq -r .token)
    - echo 'Pull rate status <'$TOKEN'>'

    - aws --version

    # Image registry base uri DO NOT CHANGE
    - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names "$REPO_NAME" --query 'repositories[0].repositoryUri' --output text)
    - echo 'REPOSITORY_URI <'$REPOSITORY_URI'>'

    # Getting the ECR token to push images DO NOT CHANGE
    - echo Logging in to Amazon ECR...
    - echo 'Aws region <'$AWS_DEFAULT_REGION'>'
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
    - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

    # - IMAGE_TAG=build-$(echo $CODEBUILD_BUILD_ID | awk -F":" '{print $2}')

    # Image tag is now taken from he package.json file
    - IMAGE_TAG=$(cat package.json | jq -r '.version')
    # Set the IMAGE_TAG with a prefix if the branch is not "master" or "main"
    - |
      if [ "$BRANCH_NAME" != "master" ] && [ "$BRANCH_NAME" != "main" ]; then
        IMAGE_TAG="$BRANCH_NAME-$IMAGE_TAG"
      fi

    - echo 'CODEBUILD_RESOLVED_SOURCE_VERSION <'$CODEBUILD_RESOLVED_SOURCE_VERSION'>'
    - echo 'COMMIT_HASH <'$COMMIT_HASH'>'
    - echo 'IMAGE_TAG <'$IMAGE_TAG'>'

  build:
    commands:

    - echo Build started on `date`
    - echo Building the Docker image...
    - cd src
    # - docker buildx create --use --name multiarch
    # - docker buildx build --push --platform linux/amd64,linux/arm64 -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest .
    # - docker buildx use containerd
    # - docker buildx build --sbom=true -f ./Dockerfile_ecs -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest . --load
    - docker build  --sbom=true -f ./Dockerfile_ecs -t $REPOSITORY_URI:$IMAGE_TAG -t $REPOSITORY_URI:latest --builder=containerd .

  post_build:
    commands:
    - docker push $REPOSITORY_URI:$IMAGE_TAG
    - |
      if [ "$BRANCH_NAME" == "master" ] && [ "$BRANCH_NAME" == "main" ]; then
        docker push $REPOSITORY_URI:latest
      fi
    - echo Build completed on `date`
